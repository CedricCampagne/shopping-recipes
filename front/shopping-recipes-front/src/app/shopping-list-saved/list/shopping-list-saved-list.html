<h1 class="text-2xl md:text-3xl font-bold text-text mb-6">
  Listes sauvegardées
</h1>

@if (lists().length > 0) {

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  @for (list of sortedListByDate(); track list.id) {

    <app-shopping-list-card
      [list]="list"
      (openDetail)="openDetail($event)"
    />

  }
</div>

} @else {

  <p class="text-text-muted italic">
    Pas de liste disponible
  </p>

}
