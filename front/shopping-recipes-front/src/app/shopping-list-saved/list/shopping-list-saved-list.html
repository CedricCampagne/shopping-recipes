@if (lists().length > 0) {
  @for (list of lists(); track list.id) {
    <div class="border p-4 rounded mb-4 shadow flex flex-col items-start gap-2">
      <p><strong>Liste ID :</strong> {{ list.id }}</p>
      <p><strong>Status :</strong> {{ list.status }}</p>
      
      <button
        class="px-4 py-2 bg-blue-600 text-white rounded hover:cursor-pointer"
        (click)="openDetail(list.id)"
      >
        Voir détail
      </button>
    </div>
  }
} @else {
  <p>Pas de liste disponible</p>
}
