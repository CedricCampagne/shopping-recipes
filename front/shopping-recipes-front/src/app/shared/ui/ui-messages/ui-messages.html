@if (ui.errorMessage()) {
  <p
    class="bg-danger text-white px-4 py-3 rounded-lg shadow-md text-center
           border border-danger/80
           animate-[fadeIn_0.2s_ease-out,fadeOut_0.4s_ease-in_1s_forwards]"
  >
    {{ ui.errorMessage() }}
  </p>
} @else if (ui.successMessage()) {
  <p
    class="bg-primary text-white px-4 py-3 rounded-lg shadow-md text-center
           border border-primary/80
           animate-[fadeIn_0.2s_ease-out,fadeOut_0.4s_ease-in_1s_forwards]"
  >
    {{ ui.successMessage() }}
  </p>
} @else if (ui.isLoading()) {
  <p
    class="bg-surface text-text px-4 py-3 rounded-lg shadow-md text-center
           border border-primary
           animate-[fadeIn_0.3s_ease-out]"
  >
    Chargement...
  </p>
}
