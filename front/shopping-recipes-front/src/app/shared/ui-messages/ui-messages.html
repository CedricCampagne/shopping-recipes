@if (ui.errorMessage()) {
  <p
    class="bg-red-600 text-white px-3 py-3 rounded text-center animate-[fadeIn_0.2s_ease-out,fadeOut_0.4s_ease-in_1s_forwards]"
  >
    {{ ui.errorMessage() }}
  </p>
} @else if (ui.successMessage()) {
  <p
    class="bg-green-600 text-white px-3 py-3 rounded text-center animate-[fadeIn_0.2s_ease-out,fadeOut_0.4s_ease-in_1s_forwards]"
  >
    {{ ui.successMessage() }}
  </p>
} @else if (ui.isLoading()) {
  <p class="bg-blue-600 text-white px-3 py-3 rounded text-center animate-[fadeIn_0.3s_ease-out]">
    Chargement...
  </p>
}
