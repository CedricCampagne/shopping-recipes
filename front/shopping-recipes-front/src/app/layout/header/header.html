<header class="bg-white shadow p-4 flex justify-around items-center">
    <h1 class="text-xl font-semibold">Shopping Recipes</h1>

    <nav class="flex gap-1">
        <a
            (click)="goIngredients()"
            class="cursor-pointer text-blue-600 font-medium px-2 py-1 border-2 rounded-lg hover:bg-blue-600 hover:text-white transition-all duration-700"
        >
            Ingredients
        </a>
        <a
            (click)="goRecipes()"
            class="cursor-pointer text-blue-600 font-medium px-2 py-1 border-2 rounded-lg hover:bg-blue-600 hover:text-white transition-all duration-700"
        >
            Recettes
        </a>
        <a
            routerLink="/app/shopping-list"
            class="text-blue-600 font-medium px-2 py-1 border-2 rounded-lg hover:bg-blue-600 hover:text-white transition-all duration-700"
        >
            Liste de course
            <span>({{ shoppingList().length }})</span>
        </a>

        <a
            (click)="goSavedLists()"
            class="cursor-pointer text-blue-600 font-medium px-2 py-1 border-2 rounded-lg hover:bg-blue-600 hover:text-white transition-all duration-700"
        >
            Mes listes
            <span>({{ savedLists().length }})</span>
        </a>

        @if (isFetching()) {
            <p class="bg-green-700 font-medium text-white px-2 py-1 rounded-2xl">Déconnexion en cours ...</p>
        } @else {
            <button
                class="text-red-600 font-medium px-2 py-1 border-2 rounded-lg hover:cursor-pointer hover:bg-red-600 hover:text-white transition-all duration-700"
                (click)="logout()"
            >
                Logout
            </button>
        }
    </nav>
</header>
