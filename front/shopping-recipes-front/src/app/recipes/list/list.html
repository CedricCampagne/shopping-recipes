<div class="space-y-4">
  @for (item of data; track item.id) {
    <div 
        class="p-4 bg-white shadow rounded"
        (click)="goToRecipe(item.id)"
    >
      <h2 class="text-lg font-semibold">{{ item.title }}</h2>
      <p class="text-gray-600">{{ item.description }}</p>
    </div>
  }
</div>
