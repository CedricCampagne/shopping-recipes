<div class="flex flex-col gap-4 mb-6 sm:flex-row sm:justify-between sm:items-center">
  <h1 class="text-2xl font-bold text-text">
    Recettes
  </h1>

  <app-ui-button (click)="goCreate()">
    + Ajouter une recette
  </app-ui-button>
</div>

<div class="flex flex-col gap-4 mb-6">
  
  <label for="name" class="text-sm font-medium text-text">
    Rechercher une recette : 
  </label>

  <div class="flex flex-col sm:flex-row sm:items-center gap-2">
    <input
      type="text"
      id="name"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-text bg-surface
            focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 max-w-md"
      placeholder="Nom ou description..."
      [value]="search()"
      (input)="search.set($any($event.target).value)"
    />

    <app-ui-button
      size="sm"
      variant="secondary"
      (click)="resetFilter()"
    >
      Réinitialiser
    </app-ui-button>
  </div>

</div>

<div class=" flex flex-col gap-4">
  @for (recipe of filteredRecipes(); track recipe.id) {
    <app-recipe-card
      [recipe]="recipe"
      [isAdded]="isAdded(recipe.id)"
      [addedServing]="addedServing(recipe.id)"
      (select)="goToRecipe($event)"
      (update)="update($event)"
      (delete)="delete($event)"
    />
  }
</div>
