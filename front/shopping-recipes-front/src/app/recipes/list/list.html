
<div class="space-y-4">
  @for (recipe of recipes(); track recipe.id) {
    <div 
        class=" border-2 border-white p-4 bg-white shadow rounded hover:cursor-pointer hover:border-blue-600 transition-all duration-300"
        (click)="goToRecipe(recipe.id)"
    >
      <h2 class="text-lg font-semibold">{{ recipe.name }}</h2>
      <p class="text-gray-600">{{ recipe.description }}</p>
    </div>
  }
</div>
