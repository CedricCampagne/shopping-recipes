<div
  class="flex flex-col gap-4 border border-gray-200 bg-surface rounded-xl p-4 shadow-sm
         hover:border-primary hover:shadow-md transition-all duration-300 cursor-pointer"
  (click)="select.emit(recipe().id)"
>
  <!-- Contenu -->
  <div class="flex-1">
    <div class="flex flex-wrap items-center gap-2 mb-2">
      <h2 class="text-lg font-semibold text-text">
        {{ recipe().name }}
      </h2>

      @if (isAdded()) {
        <span class="bg-primary text-white text-xs px-2 py-1 rounded-full">
          Déjà ajoutée pour : {{ addedServing() }} pers
        </span>
      }
    </div>

    <p class="text-text-muted">
      {{ recipe().description }}
    </p>
  </div>

  <!-- Actions -->
  <div class="flex flex-col gap-2 sm:flex-row">
    <app-ui-button
      size="sm"
      (click)="update.emit(recipe().id); $event.stopPropagation()"
    >
      Modifier
    </app-ui-button>

    <app-ui-button
      variant="danger"
      size="sm"
      (click)="delete.emit(recipe().id); $event.stopPropagation()"
    >
      Supprimer
    </app-ui-button>
  </div>
</div>
