<div class="flex justify-center py-6">
  <div class="w-full max-w-3xl mt-6 md:mt-12 bg-surface p-4 md:p-6 rounded-xl shadow-sm">

    <!-- Titre -->
    <h1 class="text-2xl md:text-3xl font-bold text-text mb-6 text-center">
      Modifier la recette : {{ form.get('name')?.value }}
    </h1>

    <!-- Formulaire -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Nom -->
      <div class="flex flex-col gap-1">
        <label for="name" class="text-sm font-medium text-text">
          Nom
        </label>

        <input
          id="name"
          type="text"
          formControlName="name"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-text bg-surface
                 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
        />
      </div>

      <!-- Description -->
      <div class="flex flex-col gap-1">
        <label for="description" class="text-sm font-medium text-text">
          Description
        </label>

        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-text bg-surface resize-none
                 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
        ></textarea>
      </div>

      <!-- Portions -->
      <div class="flex flex-col gap-1">
        <label for="servings" class="text-sm font-medium text-text">
          Portions
        </label>

        <input
          id="servings"
          type="number"
          min="1"
          formControlName="servings"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-text bg-surface
                 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
        />
      </div>

      <div class="flex flex-col gap-8 pt-5 border-t border-gray-200">

        <!-- Ingrédients -->
        <div>
          <h2 class="text-xl font-semibold text-text">
            Ingrédients de la recette
          </h2>

          <span class="text-text-muted text-sm">
            (quantité pour 1 personne)
          </span>

          <div class="mt-4 space-y-3">
            @for (ing of updateIngredients(); track $index) {
              <div
                class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between
                       border border-gray-200 p-3 rounded-lg bg-background"
              >

                <div class="flex flex-wrap gap-2 items-center">

                  <!-- Nom + ID -->
                  <div class="font-semibold text-text">
                    <span>{{ ing.ingredientName }}</span>
                  </div>

                  <!-- Quantité -->
                  <input
                    type="number"
                    class="border border-gray-300 p-2 w-24 rounded-lg bg-surface text-text
                           focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
                    [value]="ing.quantityPerPerson"
                    (input)="onQuantityChange($index, $event)"
                  />

                  <!-- Unité -->
                  <span class="text-text-muted text-sm">
                    {{ ing.unit }}
                  </span>

                </div>

                <!-- Bouton supprimer -->
                <button
                  type="button"
                  class="text-danger text-sm font-medium hover:underline cursor-pointer
                         self-start sm:self-auto"
                  (click)="removeIngredient(ing.id!)"
                >
                  Supprimer
                </button>

              </div>
            }
          </div>
        </div>

        <!-- Ajouter un ingrédient -->
        <div class="pt-5 border-t border-gray-200">
          <h2 class="text-xl font-semibold text-text mb-4">
            Ajouter un ingrédient
          </h2>

          <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
            <select
              class="w-full sm:flex-1 border border-gray-300 p-2 rounded-lg bg-surface text-text
                     focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
              (change)="onSelectIngredient($event)"
            >
              <option value="">
                -- Choisir un ingrédient --
              </option>

              @for (ing of allIngredients(); track $index) {
                <option [value]="ing.id">
                  {{ ing.name }} ({{ ing.unit }})
                </option>
              }
            </select>

            <app-ui-button
              type="button"
              (click)="addIngredientFromDb()"
            >
              Ajouter
            </app-ui-button>
          </div>
        </div>
      </div>

      <div class="flex items-start gap-4 pt-2">
        <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
          <app-ui-button type="submit">
            Mettre à jour
          </app-ui-button>

          <app-ui-button
            type="button"
            variant="secondary"
            (click)="goToRecipe()"
          >
            Annuler
          </app-ui-button>
        </div>
      </div>
    </form>
  </div>
</div>
